# CodeDeploy (EC2) for the Data Platform backend.
# Terraform uploads this ec2/ folder to the deploy-bundle bucket; the backend
# build stage adds it to the artifact next to src/api, deploy.env and
# image_tag.txt. Hooks run as root from the unpacked revision.
#
#   BeforeInstall     checks (docker, aws cli, nginx), writes .env from Secrets Manager
#   (Install)         copy the revision to /opt/data-platform/release
#   AfterInstall      pull images, build app images, start local DB (dev), migrate
#   ApplicationStart  docker compose up -d --build
#   ValidateService   health check must report the new commit
#
# A failed hook fails the deployment; the deployment group's automatic
# rollback then redeploys the last successful revision.

version: 0.0
os: linux

files:
  - source: /
    destination: /opt/data-platform/release
file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 3000
      runas: root
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 900
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: root
