# Host Nginx site for the AWS deployment (origin behind CloudFront).
# Installed by the CodeDeploy hook application_start.sh as
# /etc/nginx/conf.d/data-platform.conf, checked with `nginx -t`, then reloaded.
# The hook replaces "listen 443" with PROXY_HTTPS_PORT and the certificate
# directory with TLS_CERT_DIR. Backend and TiTiler listen on 127.0.0.1 only.
#
# Copied from data-platform/src/web/nginx/nginx.conf without the parts that
# moved elsewhere:
#   - React static files       -> S3 + CloudFront
#   - port 80 -> 443 redirect  -> CloudFront (viewer redirect-to-https)
#   - proxy_cache_* lines      -> removed (no proxy_cache zone was defined, so
#                                 they had no effect)
#   - Docker service names     -> 127.0.0.1:8000 (backend), 127.0.0.1:8001 (titiler)
# The /api and /titiler routing, timeouts and buffers are unchanged.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/data-platform/ssl/fullchain.pem;
    ssl_certificate_key /etc/data-platform/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1G;

    # Stream dataset zips without the short API timeout.
    location = /api/download_dataset {
        proxy_pass http://127.0.0.1:8000/download_dataset;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # FastAPI (the /api prefix is stripped, as before).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # TiTiler raster tiles (the /titiler prefix is stripped, as before).
    location /titiler/ {
        proxy_pass http://127.0.0.1:8001/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Everything else is served by CloudFront from S3, never by this host.
    location / {
        return 404;
    }
}
